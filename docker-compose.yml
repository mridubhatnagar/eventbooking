services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: eventbooking
      POSTGRES_PASSWORD: eventbooking
      POSTGRES_DB: eventbooking
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventbooking -d eventbooking"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  mock-razorpay:
    build: .
    command: gunicorn -b 0.0.0.0:5000 mock_razorpay_app:app
    env_file:
      - .env.local

  app:
    build: .
    command: sh -c "flask --app run db upgrade && gunicorn -b 0.0.0.0:5000 run:app"
    env_file:
      - .env.local
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mock-razorpay:
        condition: service_started

  worker:
    build: .
    command: celery -A celery_worker.celery worker --loglevel=info
    env_file:
      - .env.local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mock-razorpay:
        condition: service_started

  flower:
    build: .
    command: celery -A celery_worker.celery flower --port=5555
    env_file:
      - .env.local
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_started

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    profiles: ["test"]

volumes:
  db_data:
